services:
  eml2pdf:
    build: .
    container_name: eml2pdf
    restart: unless-stopped
    ports:
      # Bind to loopback by default — front it with a reverse proxy / n8n on the same network.
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_REQUEST_MB=50
      - DEFAULT_WIDTH_PX=900
      - DEFAULT_MAX_HEIGHT_PX=30000
      # Remote images on by default for fidelity with marketing/signature emails.
      # Private/loopback/IMDS hosts are still blocked at the network filter, so
      # SSRF is contained even when this is true. Set to false if you need a
      # stricter posture (no public-internet fetches at all from the renderer).
      - LOAD_REMOTE_IMAGES=true
      - DEFAULT_TIMEZONE=UTC
      - MAX_CONCURRENT_RENDERS=5
      - MAX_QUEUED_EML_MB=500
      - MAX_QUEUE_WAIT_MS=180000
      # - API_KEY=change-me   # uncomment to require X-API-Key header
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
