services:
  eml2pdf:
    build: .
    container_name: eml2pdf
    restart: unless-stopped
    ports:
      # Bind to loopback by default — front it with a reverse proxy / n8n on the same network.
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_REQUEST_MB=50
      - DEFAULT_WIDTH_PX=900
      - DEFAULT_MAX_HEIGHT_PX=30000
      - LOAD_REMOTE_IMAGES=false
      - DEFAULT_TIMEZONE=UTC
      - MAX_CONCURRENT_RENDERS=3
      # - API_KEY=change-me   # uncomment to require X-API-Key header
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
